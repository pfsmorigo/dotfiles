# Enable status bar and set background colors (adjust colors to match your theme)
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style bg=colour235,fg=colour255

# Move window list to the left and clear the left status section
set -g status-justify left
set -g status-left ""

# Powerline arrow symbols (requires a Powerline/Nerd Font)
# Left triangle icon: \uE0B2 ()

# Assemble right status bar with Powerline segments
set -g status-right-length 150
set -g status-right "#[fg=colour238,bg=colour235]#[fg=colour255,bg=colour238] #S #[fg=colour31,bg=colour238]#[fg=colour255,bg=colour31] %Y-%m-%d  %H:%M #[fg=colour254,bg=colour31]#[fg=colour235,bg=colour254] #h "

# Window tab styling
setw -g window-status-format "#[fg=colour244,bg=colour235] #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour31]#[fg=colour255,bg=colour31,bold] #I:#W #[fg=colour31,bg=colour235]"
