font: Ubuntu
sleep: ["22:00", "08:00"]
bind:
  - 10.3.0.0/16

homeassistant:
  url: https://home.smow.io
  token: pass:homeassistant/api

healthchecks:
  url: https://hc.smow.io
  token: pass:healthchecks/api

openrouter:
  token: pass:openrouter/api

zigbee2mqtt:
  url: http://home.smow.io:8099

creality:
  url: http://k1max.lan

adsb:
  url: http://pfsmorigo-station-2.l.adsb.im:8080/
  alert:
    - type: airport
      match: equals
      value:
        - SJK
    - type: altitude
      match: below
      value: 1000
    - type: aircraft_type
      match: equals
      value:
        - A124 # Antonov An-124 Ruslan
        - A337 # Airbus A330-700L BelugaXL
        - A388 # Airbus A380-800
        - A3ST # Airbus A300-600ST Beluga
        - AN12 # Antonov An-12
        - AN26 # Antonov An-26
        - AN32 # Antonov An-32
        - B742 # Boeing 747-200
        - B744 # Boeing 747-400
        - B748 # Boeing 747-8
        - B74S # Boeing 747SP
        - BLCF # Boeing 747-400LCF Dreamlifter
