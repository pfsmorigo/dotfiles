global:
  font: Ubuntu
  turn_on: 06:00
  turn_off: 22:00

  homeassistant:
    url: https://home.smow.io
    api_key: $(pass homeassistant/api)

  healthchecks:
    url: https://hc.smow.io
    api_key: $(pass healthchecks/api)

  openrouter:
    api_key: $(pass openrouter/api)

  zigbee2mqtt:
    broker: http://home.smow.io:8099/

  creality:
    host: k1max.lan

widgets:
  - widget: system_metrics

  - widget: glances
    label: truenas
    url: http://truenas.smow.io:30015/

  - widget: glances
    url: http://reno.lan:30015/

  - widget: nvidia

  - widget: system_metrics
    mode: net_rx
    interface: enp4s0
    unit: MB/s
    show_unit: false
    press:
      deck: unicodes.yaml

  - widget: system_metrics
    mode: net_tx
    interface: enp4s0
    unit: MB/s
    show_unit: false

  - widget: openrouter

  - multiple:
    - widget: homeassistant
      alias: Power
      entity_id: sensor.shelly_pro_total_active_power
      mode: graph
      max: 1200
      alert_above: 900
    - widget: homeassistant
      alias: Power
      entity_id: sensor.shelly_pro_total_apparent_power
      mode: graph
      max: 1600
      alert_above: 1100
      precision: 0
    hold:
      deck: power.yaml

  - multiple:
    - widget: finance
      pair: USD-BRL
    - widget: finance
      pair: BTC-BRL
    hold:
      deck: finance.yaml

  - widget: homeassistant
    alias: Lights
    press:
      service: switch.toggle
      entity_id: switch.downstairs_office_switch_top
    hold:
      service: switch.toggle
      entity_id: switch.downstairs_office_switch_middle
    long_hold:
      deck: lights.yaml

  - widget: creality
    label: 3D Printer

  - widget: pomodoro

  - widget: zigbee2mqtt

  - widget: healthchecks
    press:
      deck: healthchecks://
    hold:
      deck: config.yaml
