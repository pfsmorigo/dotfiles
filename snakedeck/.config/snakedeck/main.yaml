deck:
  - card: system_metrics

  - card: system_metrics
    mode: net
    interface: enp4s0

  - card: nvidia

  - card: glances
    url: http://truenas.smow.io:30015/
    title: TrueNAS

  - card: multi
    multi:
      - card: finance
        symbol: USD-BRL
      - card: finance
        symbol: BTC-BRL
    hold:
      deck: finance.yaml
    rotate: 3

  - card: pomodoro

  - card: creality

  - card: openrouter

  - card: adsb
    title: Flights

  - card: weather

  - card: homeassistant
    title: Lights
    press:
      service: switch.toggle
      entity_id: switch.downstairs_office_switch_top
    hold:
      service: switch.toggle
      entity_id: switch.downstairs_office_switch_middle
    long_hold:
      deck: lights.yaml

  - card: multi
    multi:
      - card: homeassistant
        title: Power
        entity_id: sensor.shelly_pro_total_active_power
        mode: graph
        max: 1200
        alert_above: 900
      - card: homeassistant
        title: Power
        entity_id: sensor.shelly_pro_total_apparent_power
        mode: graph
        max: 1600
        alert_above: 1100
        precision: 0
    hold:
      deck: power.yaml

  - card: zigbee2mqtt

  - card: homeassistant

  - card: healthchecks
    press:
      deck: healthchecks://
    hold:
      deck:
        - card: custom
          unicode: 🔆
          fill_color: "#000"
          title: Off
          press:
            device: sleep

        - card: custom
          unicode: 🔆
          fill_color: "#222"
          title: 25%
          press:
            device: brightness=25

        - card: custom
          unicode: 🔆
          fill_color: "#444"
          title: 50%
          press:
            device: brightness=50

        - card: custom
          unicode: 🔆
          fill_color: "#666"
          title: 75%
          press:
            device: brightness=75

        - card: custom
          unicode: 🔆
          fill_color: "#888"
          title: 100%
          press:
            device: brightness=100
