widgets:
  - widget: homeassistant
    alias: Watts
    entity_id: sensor.shelly_pro_total_active_power
    mode: graph
    max: 1200
    show_unit: false

  - widget: homeassistant
    alias: A
    entity_id: sensor.shelly_pro_phase_a_active_power
    mode: graph
    max: 400
    show_unit: false

  - widget: homeassistant
    alias: B
    entity_id: sensor.shelly_pro_phase_b_active_power
    mode: graph
    max: 400
    unit:

  - widget: homeassistant
    alias: C
    entity_id: sensor.shelly_pro_phase_c_active_power
    mode: graph
    max: 400
    show_unit: false


  - widget: homeassistant
    alias: VA
    index: 5
    entity_id: sensor.shelly_pro_total_apparent_power
    mode: graph
    max: 1600
    show_unit: false

  - widget: homeassistant
    alias: A
    entity_id: sensor.shelly_pro_phase_a_apparent_power
    mode: graph
    max: 600
    show_unit: false

  - widget: homeassistant
    alias: B
    entity_id: sensor.shelly_pro_phase_b_apparent_power
    mode: graph
    max: 600
    show_unit: false

  - widget: homeassistant
    alias: C
    entity_id: sensor.shelly_pro_phase_c_apparent_power
    mode: graph
    max: 600
    show_unit: false


  - widget: homeassistant
    index: 10
    alias: Fridge
    entity_id: sensor.kitchen_refrigerator_energy
    mode: graph
    max: 1600
    show_unit: false

  - widget: homeassistant
    alias: Washer
    entity_id: sensor.laundry_room_washer_energy
    mode: graph
    max: 400
    show_unit: false

  - widget: homeassistant
    alias: 3D Printer
    entity_id: sensor.creality_k1_max_energy
    mode: graph
    max: 1300
    alert_above: 900
    show_unit: false
