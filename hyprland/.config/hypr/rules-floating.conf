# Floating window rules
# Automatically populated by ~/.config/hypr/scripts/add_floating_rule.sh
# Syntax: windowrule = float on, match:class ^(regex)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(solaar)$
windowrule = float on, match:class ^(xdg-desktop-portal-.*)$
windowrule = float on, match:title ^(Open File|Save As|Confirm to replace files)$
windowrule = float on, match:class ^(org\.deskflow\.deskflow)$
windowrule = float on, match:class ^(org\.gnome\.seahorse\.Application)$
windowrule = float on, match:class ^(deskflow)$
windowrule = float on, match:class ^(org\.gnome\.Settings)$
windowrule = float on, match:class ^(org\.remmina\.Remmina)$
windowrule = float on, match:class ^(nordvpn-gui)$
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = float on, match:class ^(mpv)$
windowrule = float on, match:class ^(snap-store)$
windowrule = float on, match:class ^(org\.gnome\.Loupe)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(net\.nokyan\.Resources)$
windowrule = float on, match:class ^(google-chrome)$
