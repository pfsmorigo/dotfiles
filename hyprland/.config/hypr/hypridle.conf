# HYPRIDLE CONFIGURATION
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn on display after resume
    ignore_dbus_inhibit = false                 # Respect media/browser idle inhibition
}

# Dim backlight after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -s set 10%
    on-resume = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -r
}

# Lock screen after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display (DPMS) after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend system after 30 minutes (1800s)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
