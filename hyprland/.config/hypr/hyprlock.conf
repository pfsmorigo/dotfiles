# HYPRLOCK CONFIGURATION
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.80
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# TIME (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = Ubuntu Sans Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(220, 220, 220, 0.90)
    font_size = 20
    font_family = Ubuntu Sans
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# USER GREETING
label {
    monitor =
    text = Hi, $USER
    color = rgba(200, 200, 200, 0.8)
    font_size = 14
    font_family = Ubuntu Sans
    position = 0, -40
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle
    outer_color = rgba(97, 175, 239, 0.8) # #61AFEF accent
    inner_color = rgba(40, 44, 52, 0.8)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Ubuntu Sans
    placeholder_text = <i><span foreground="##abb2bf">Password...</span></i>
    hide_input = false
    rounding = 12
    check_color = rgba(97, 175, 239, 1.0)
    fail_color = rgba(224, 108, 117, 1.0) # #E06C75 error red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(229, 192, 123, 1.0) # yellow warning
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}
